<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>Quill — Clean Seal</title>
  <desc>Quill clean seal version without aged texture. For small sizes (app icon, favicon).</desc>
  <!-- Cinnabar seal square -->
  <rect x="20" y="20" width="320" height="320" rx="10" fill="#B23A2B"/>
  <!-- Q monogram -->
  <g transform="translate(180 180)" fill="none" stroke="#F1E9D6" stroke-width="22" stroke-linecap="round">
    <ellipse cx="0" cy="-4" rx="80" ry="82"/>
    <path d="M 30 30 Q 56 56 92 88"/>
  </g>
  <!-- Nib touchdown dot -->
  <circle cx="290" cy="290" r="9" fill="#F1E9D6"/>
</svg>
